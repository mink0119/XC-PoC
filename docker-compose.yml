# Full PoC stack on one host (e.g. 192.168.47.81)
#   docker compose up -d --build
#   Pet Shop API:     http://192.168.47.81/health
#   Attack lab UI:    http://192.168.47.81:8765

services:
  petshop:
    build: ./petshop
    image: petshop-bola:latest
    container_name: petshop-api
    restart: unless-stopped
    ports:
      - "${PETSHOP_PORT:-80}:80"
    environment:
      PORT: "80"
      ENFORCE_OWNERSHIP: "${ENFORCE_OWNERSHIP:-0}"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  attack-lab:
    build: ./scenarios
    image: xc-poc-attack-lab:latest
    container_name: xc-poc-attack-lab
    restart: unless-stopped
    ports:
      - "${LAB_PORT:-8765}:8765"
    environment:
      LAB_HOST: "0.0.0.0"
      LAB_PORT: "8765"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
